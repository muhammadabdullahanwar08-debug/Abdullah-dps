<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPS Senior Students - Directed by Abdullah Anwar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      color: #1a202c;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      border-top: 6px solid #1e40af;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 20px;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 26px;
      color: #1e3a8a;
      font-weight: 700;
    }

    .title-group p {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }

    .director-tag {
      display: inline-block;
      margin-top: 8px;
      background-color: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge {
      background-color: #1e40af;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #1e40af;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: #1e40af;
      color: white;
    }

    .btn-primary:hover {
      background-color: #1e3a8a;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #1e293b;
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      text-align: left;
      padding: 13px 15px;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:hover {
      background-color: #f1f5f9;
    }

    .roll-no {
      font-weight: 700;
      color: #64748b;
      width: 70px;
    }

    .student-name {
      font-weight: 600;
      color: #0f172a;
      font-size: 16px;
    }

    .delete-btn {
      background: none;
      color: #dc2626;
      padding: 4px 8px;
      font-size: 13px;
    }

    .delete-btn:hover {
      background-color: #fef2f2;
      border-radius: 4px;
    }

    footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 14px;
      color: #475569;
    }

    footer strong {
      color: #1e3a8a;
    }

    @media print {
      .controls, .delete-btn, .action-col {
        display: none !important;
      }
      body {
        background: white;
        padding: 0;
      }
      .container {
        box-shadow: none;
        border-top: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <h1>DPS Senior Students</h1>
        <p>Official Student Name List</p>
        <span class="director-tag">Directed by Abdullah Anwar</span>
      </div>
      <span class="badge" id="studentCount">Total: 14</span>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search DPS senior student..." onkeyup="renderList()" />
      <button class="btn-secondary" onclick="sortAlphabetically()">Sort A–Z</button>
      <button class="btn-primary" onclick="window.print()">Print List</button>
    </div>

    <div class="controls">
      <input type="text" id="newStudentInput" placeholder="Add new senior student name..." onkeypress="handleEnter(event)" />
      <button class="btn-primary" onclick="addStudent()">+ Add Student</button>
    </div>

    <table>
      <thead>
        <tr>
          <th class="roll-no">Sr. #</th>
          <th>Student Name</th>
          <th class="action-col" style="text-align: right;">Action</th>
        </tr>
      </thead>
      <tbody id="studentTableBody"></tbody>
    </table>

    <footer>
      Directed by <strong>Abdullah Anwar</strong> &bull; DPS Senior Students
    </footer>
  </div>

  <script>
    let students = [
      "Abdullah Anwar",
      "Ahmad Mahmood",
      "Abdul Rehman Afzal",
      "Abdul Rehman Safdar",
      "Kashan Barkat",
      "Husnain Amir",
      "Saim Shahbaz",
      "Rehan Saleem",
      "Raees Khan",
      "Zaeem Gohar",
      "Ahmad Naeem",
      "Abdullah Amir",
      "Haris Shahzad",
      "Sibt-e-Ali"
    ];

    function renderList() {
      const tbody = document.getElementById("studentTableBody");
      const searchQuery = document.getElementById("searchInput").value.toLowerCase();
      tbody.innerHTML = "";

      students.forEach((name, index) => {
        if (name.toLowerCase().includes(searchQuery)) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td class="roll-no">${index + 1}</td>
            <td class="student-name">${name}</td>
            <td class="action-col" style="text-align: right;">
              <button class="delete-btn" onclick="removeStudent(${index})">Remove</button>
            </td>
          `;
          tbody.appendChild(row);
        }
      });

      document.getElementById("studentCount").textContent = `Total: ${students.length}`;
    }

    function addStudent() {
      const input = document.getElementById("newStudentInput");
      const rawName = input.value.trim();
      if (!rawName) return;

      const formattedName = rawName
        .split(" ")
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(" ");

      students.push(formattedName);
      input.value = "";
      renderList();
    }

    function removeStudent(index) {
      students.splice(index, 1);
      renderList();
    }

    function sortAlphabetically() {
      students.sort((a, b) => a.localeCompare(b));
      renderList();
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        addStudent();
      }
    }

    renderList();
  </script>

</body>
</html>
